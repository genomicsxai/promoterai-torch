[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "promoterai-torch"
version = "0.3.0"
description = "PyTorch port of PromoterAI for promoter variant scoring."
authors = [{ name = "Adam He", email = "adamyhe@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<3.14"
keywords = [
    "bioinformatics",
    "deep-learning",
    "genomics",
    "promoter",
    "pytorch",
    "variant-effect-prediction",
    "metaformer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.20",
    "pandas>=2.0",
    "pyfaidx>=0.8",
    "tqdm>=4.0",
    "numba>=0.58",
]

[project.urls]
Homepage = "https://github.com/genomicsxai/promoterai-torch"
Repository = "https://github.com/genomicsxai/promoterai-torch"
Issues = "https://github.com/genomicsxai/promoterai-torch/issues"

[project.optional-dependencies]
convert = [
    "tensorflow",
    "tf-keras",
]
train = ["h5py>=3.0", "pybigtools>=0.2.5"]
interpret = ["tangermeme>=0.5"]
wandb = ["wandb>=0.16"]

[dependency-groups]
test = [
    "pytest>=8",
    "h5py>=3.0",
    "pybigtools>=0.2.5",
    "tangermeme>=0.5",
]
publish = ["build>=1.2", "twine>=5.0"]
dev = [{ include-group = "test" }, { include-group = "publish" }]

[project.scripts]
promoterai-torch = "promoterai_torch.cli:main"

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["src/promoterai_torch"]

[tool.hatch.build.targets.sdist]
only-include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src/promoterai_torch",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
