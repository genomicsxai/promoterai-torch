[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "promoterai-torch"
version = "0.4.0"
description = "PyTorch port of PromoterAI for promoter variant scoring."
authors = [{ name = "Adam He", email = "adamyhe@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "bioinformatics",
    "deep-learning",
    "genomics",
    "promoter",
    "pytorch",
    "variant-effect-prediction",
    "metaformer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.20",
    "pandas>=2.0",
    "pyfaidx>=0.8",
    "tqdm>=4.0",
    "numba>=0.58",
]

[project.urls]
Homepage = "https://github.com/genomicsxai/promoterai-torch"
Repository = "https://github.com/genomicsxai/promoterai-torch"
Issues = "https://github.com/genomicsxai/promoterai-torch/issues"

[project.optional-dependencies]
train = ["h5py>=3.0", "figwig>=0.2.0"]
interpret = ["tangermeme>=1.6"]
wandb = ["wandb>=0.16"]

[dependency-groups]
test = [
    "pytest>=8",
    "h5py>=3.0",
    "figwig>=0.2.0",
    "tangermeme>=1.6",
]
# TensorFlow/tf-keras are only needed by the cross-framework equivalence tests
# (conversion itself reads SavedModels with numpy). No TF wheels exist for
# Python 3.14 yet, so those tests skip there.
tf = [
    "tensorflow; python_version < '3.14'",
    "tf-keras; python_version < '3.14'",
]
publish = ["build>=1.2", "twine>=5.0"]
dev = [{ include-group = "test" }, { include-group = "publish" }]
# Optional PyTorch build selection for uv users (see README "Choosing a PyTorch
# build"). Without one of these, torch comes from PyPI (CUDA 13.0 on Linux,
# GPUs sm_75+). These are dependency groups, not extras, so they never appear in
# the published package's metadata, where they would do nothing under pip.
cu126 = ["torch>=2.1"] # CUDA 12.6 build: also supports Maxwell/Pascal/Volta (sm_50-sm_70)
cu130 = ["torch>=2.1"] # CUDA 13.0 build from the PyTorch index (sm_75+)
cpu = ["torch>=2.1"]   # CPU-only build: no CUDA libraries downloaded

[project.scripts]
promoterai-torch = "promoterai_torch.cli:main"

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["src/promoterai_torch"]

[tool.hatch.build.targets.sdist]
only-include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src/promoterai_torch",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
# At most one PyTorch build group per environment.
conflicts = [
    [{ group = "cu126" }, { group = "cu130" }, { group = "cpu" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", group = "cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu130", group = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu", group = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
