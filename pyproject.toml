[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promoterai-torch"
version = "0.1.0"
authors = [{ name = "Adam He", email = "adamyhe@gmail.com" }]
license = { file = "LICENSE" }
readme = "README.md"
urls = { homepage = "https://github.com/genomicsxai/promoterai-torch" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.20",
    "pandas>=2.0",
    "pyfaidx>=0.8",
    "tqdm>=4.0",
]

[project.optional-dependencies]
convert = [
    "tensorflow-cpu; sys_platform != 'darwin'",
    "tensorflow; sys_platform == 'darwin'",
    "tf-keras",
]
train = ["h5py>=3.0", "scipy>=1.10", "pyBigWig>=0.3"]
wandb = ["wandb>=0.16"]
dev = ["pytest>=8", "h5py>=3.0", "scipy>=1.10", "pyBigWig>=0.3", "tangermeme>=0.5"]

[project.scripts]
promoterai-torch = "promoterai_torch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "PromoterAI*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
